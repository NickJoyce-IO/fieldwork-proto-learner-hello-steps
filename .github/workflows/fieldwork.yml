# Runs this Project's Steps on every pull request and lists which ones pass in
# the check summary. A pull request may leave the Current Step unfinished, so
# the check fails only when the Steps cannot be run at all.
name: Fieldwork

on:
  pull_request:

jobs:
  steps:
    name: Fieldwork Steps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Run Steps
        env:
          # Step 0 of a Track's first Project asks GitHub whether main is protected.
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          npm test --silent > "$RUNNER_TEMP/steps.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/steps.txt"
          {
            echo "## Fieldwork Steps"
            echo
            echo '```'
            cat "$RUNNER_TEMP/steps.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Exit code 1 means the Current Step is still in progress.
          [ "$status" -le 1 ]
